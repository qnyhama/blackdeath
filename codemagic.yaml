workflows:
  android-workflow:
    name: BlackDeath Android
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Setup project
        script: |
          cd /Users/builder/clone
          unzip blackdeath_project.zip
          cp -r blackdeath/. .
          ls
      - name: Get packages
        script: |
          cd /Users/builder/clone
          flutter pub get
      - name: Build APK
        script: |
          cd /Users/builder/clone
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
