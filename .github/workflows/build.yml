name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Setup project
        run: |
          unzip blackdeath_project.zip
          cp -r blackdeath/. .
      - name: Fix build files
        run: |
          sed -i "s/ext.kotlin_version = '<latest-version>'/ext.kotlin_version = '1.8.22'/" android/build.gradle
          sed -i "s/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/" android/app/build.gradle
          sed -i "s/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/" android/app/build.gradle
      - name: Get packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: blackdeath-apk
          path: build/app/outputs/flutter-apk/app-release.apk
