name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Setup project
        run: |
          unzip blackdeath_project.zip
          cp -r blackdeath/. .
          sed -i "s/<latest-version>/1.8.22/g" android/build.gradle
      - name: Get packages
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: blackdeath-apk
          path: build/app/outputs/flutter-apk/app-release.apk
