name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - run: unzip blackdeath_project.zip
      - run: cd blackdeath && flutter pub get
      - run: cd blackdeath && flutter build apk --release
      - uses: actions/upload-artifact@v3
        with:
          name: blackdeath-apk
          path: blackdeath/build/app/outputs/flutter-apk/app-release.apk
